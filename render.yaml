databases:
  - name: transcriber-db
    plan: free
    databaseName: transcriber
    user: transcriber

services:
  - type: web
    name: transcriber-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transcriber-db
          property: connectionString
      - key: STORAGE_PATH
        value: ./storage
      - key: JWT_SECRET
        generateValue: true
      - key: WHISPER_MODEL
        value: tiny
      - key: FRONTEND_URL
        value: https://transcriber-frontend.onrender.com

  - type: web
    name: transcriber-frontend
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://transcriber-backend-30mb.onrender.com
      - key: NODE_VERSION
        value: 20.11.0
